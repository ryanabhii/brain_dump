name: tracker_app
description: "Tracker — killzones, spend, capture, household, body. Local-first with optional Google Drive sync."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management + local persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # Formatting
  intl: ^0.20.2
  # Timezone detection + timezone-aware notifications
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  flutter_local_notifications: any
  # Google Drive sync (backup + multi-user, backend-free)
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.6.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
