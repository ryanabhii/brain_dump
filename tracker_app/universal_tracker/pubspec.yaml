name: tracker_app
description: "Universal Tracker: by Xenon54 — killzones, spend, capture, household, body. Local-first with optional Google Drive sync."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management + local persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # Formatting
  intl: ^0.20.2
  # Timezone detection + timezone-aware notifications
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  flutter_local_notifications: any
  # Google Drive sync (backup + multi-user, backend-free)
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.6.0
  # Voice brain dumps, audio-first: `record` owns the mic exclusively and
  # saves an m4a (running a live recognizer alongside it made the two fight
  # over the mic); `audioplayers` plays the file back; `whisper_ggml` runs
  # whisper.cpp on-device to transcribe the file after the fact.
  # `path_provider` gives us a cross-platform docs dir.
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  whisper_ggml: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Pin the Linux implementation of `record` to a version that actually
# implements the resolved `record_platform_interface` (1.6.0). Without this
# override, pub resolves to `record_linux 0.7.2` (~2 years stale, missing
# `startStream` and the new `hasPermission({request})` signature), which
# breaks `flutter build` on every platform — the Linux impl is compiled
# even for Android targets. `^1.3.1` keeps us inside the 1.x series so we
# don't accidentally jump to 2.x (which requires `record_platform_interface`
# 2.x and would yank the rest of the family out from under us).
dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a7a8a"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

